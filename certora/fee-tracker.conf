{
  "files": ["certora/harnesses/FeeTrackerHarness.sol"],
  "verify": "FeeTrackerHarness:certora/specs/fee-tracker.spec",
  "prover_args": ["-enableEventReporting false"],
  "solc": "solc",
  "solc_allow_path": ".",
  "solc_optimize": "200",
  "solc_via_ir": true,
  "solc_evm_version": "cancun",
  "strict_solc_optimizer": true,
  "packages": [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts",
    "account-abstraction/=lib/account-abstraction/contracts",
    "forge-std/=lib/forge-std/src",
    "yieldseeker/=."
  ],
  "max_concurrent_rules": 1,
  "loop_iter": 2,
  "optimistic_loop": true,
  "rule_sanity": "basic",
  "build_cache": false
}
