[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.38"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ignored_error_codes = [5667, 5574, 3860]
# NOTE(krishan711): with dynamic test linking on, a test that hits `vm.expectRevert` followed by `new` stops there and still passes, so its later checks never run
dynamic_test_linking = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "account-abstraction/=lib/account-abstraction/contracts/",
    "morpho-blue/=lib/morpho-blue/src/",
    "aave-v3/=lib/aave-v3/src/contracts/",
    "lib/aave-v3/:openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "@uniswap/v3-core/=lib/uniswap-v3-core/",
    "@uniswap/v3-periphery/=lib/uniswap-v3-periphery/",
    "@uniswap/swap-router-contracts/=lib/uniswap-swap-router/",
    "aerodrome-slipstream/=lib/aerodrome-slipstream/contracts/",
    "lib/aerodrome-slipstream/:contracts/=lib/aerodrome-slipstream/contracts/",
    "aerodrome/=lib/aerodrome-contracts/contracts/",
    "@chainlink/contracts/=lib/chainlink/contracts/",
    "aave-v4/=lib/aave-v4/src/",
    "src/interfaces/=lib/aave-v4/src/interfaces/",
    "src/hub/=lib/aave-v4/src/hub/",
    "src/spoke/=lib/aave-v4/src/spoke/",
    "src/dependencies/=lib/aave-v4/src/dependencies/",
    "vendored-interfaces/=lib/vendored-interfaces/",
    "morpho-bundler3/=lib/morpho-bundler3/src/",
]

fs_permissions = [{ access = "read-write", path = "./" }]

# Quick enough for every `forge test` and CI; `FOUNDRY_PROFILE=deep forge test --match-path "test/{fuzz,invariant}/**"` for long local runs
[profile.default.fuzz]
runs = 256
seed = "0x711"

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 1000
depth = 200
fail_on_revert = false

[fmt]
line_length = 240
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "preserve"
sort_imports = true

[lint]
exclude_lints = ["unwrapped-modifier-logic", "asm-keccak256"]
